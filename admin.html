<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - គ្រប់គ្រងហាង</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">My<span>Shop</span> Admin</div>
    <div class="nav-links">
      <a href="index.html">មើលហាង</a>
      <a href="#" onclick="logout()">ចាកចេញ</a>
    </div>
  </nav>

  <!-- LOGIN FORM -->
  <div class="login-box" id="loginBox">
    <h2 style="margin-bottom:15px;">ចូលគណនី Admin</h2>
    <form onsubmit="login(event)">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <p id="loginError" style="color:red; margin-bottom:10px;"></p>
      <button class="btn btn-block" type="submit">ចូល</button>
    </form>
  </div>

  <!-- ADMIN PANEL -->
  <div class="admin-container" id="adminPanel" style="display:none;">

    <div class="tabs">
      <button class="tab-btn active" id="tabDashboard" onclick="switchAdminTab('dashboard')">📊 Dashboard</button>
      <button class="tab-btn" id="tabProducts" onclick="switchAdminTab('products')">👗 ទំនិញ</button>
      <button class="tab-btn" id="tabOrders" onclick="switchAdminTab('orders')">📦 ការបញ្ជាទិញ</button>
    </div>

    <!-- DASHBOARD TAB -->
    <div id="dashboardTab">
      <div class="trust-grid" style="margin-bottom:30px;">
        <div class="trust-item"><i class="fa-solid fa-box"></i><h3 id="statProducts">0</h3><p>ទំនិញសរុប</p></div>
        <div class="trust-item"><i class="fa-solid fa-bag-shopping"></i><h3 id="statOrders">0</h3><p>ការបញ្ជាទិញសរុប</p></div>
        <div class="trust-item"><i class="fa-solid fa-sack-dollar"></i><h3 id="statRevenue">$0</h3><p>ចំណូលសរុប</p></div>
        <div class="trust-item"><i class="fa-solid fa-triangle-exclamation"></i><h3 id="statLowStock">0</h3><p>ស្តុកជិតអស់ (≤5)</p></div>
      </div>
    </div>

    <!-- PRODUCTS TAB -->
    <div id="productsTab" style="display:none;">
      <div class="admin-form">
        <h2 style="margin-bottom:15px;">➕ បន្ថែម / កែប្រែ ទំនិញ</h2>
        <form id="productForm">
          <input type="hidden" id="editId">
          <input type="text" id="pName" placeholder="ឈ្មោះទំនិញ" required>
          <textarea id="pDesc" placeholder="ការពិពណ៌នា" rows="3"></textarea>
          <input type="number" id="pPrice" placeholder="តម្លៃ ($)" step="0.01" required>
          <input type="number" id="pDiscount" placeholder="បញ្ចុះតម្លៃ % (0 បើគ្មាន)">
          <input type="number" id="pRating" placeholder="Rating (0-5)" step="0.1" max="5">
          <select id="pTag">
            <option value="none">គ្មាន Tag</option>
            <option value="new">🆕 New Arrival</option>
            <option value="bestseller">🔥 Best Seller</option>
            <option value="flashsale">⚡ Flash Sale</option>
          </select>
          <input type="text" id="pCategory" placeholder="ប្រភេទ (ឧ. អាវ, ខោ, សំពត់)">
          <input type="text" id="pSize" placeholder="ទំហំ (ឧ. S, M, L)">
          <input type="text" id="pColor" placeholder="ពណ៌">
          <input type="number" id="pStock" placeholder="ចំនួនស្តុក" required>
          <input type="file" id="pImage" accept="image/*">
          <button class="btn btn-block" type="submit">រក្សាទុក</button>
        </form>
      </div>

      <h2 style="margin-bottom:15px;">📦 ទំនិញទាំងអស់</h2>
      <table class="admin-table">
        <thead>
          <tr><th>រូបភាព</th><th>ឈ្មោះ</th><th>តម្លៃ</th><th>ប្រភេទ</th><th>ស្តុក</th><th>សកម្មភាព</th></tr>
        </thead>
        <tbody id="productTableBody"></tbody>
      </table>
    </div>

    <!-- ORDERS TAB -->
    <div id="ordersTab" style="display:none;">
      <h2 style="margin-bottom:15px;">📦 ការបញ្ជាទិញរបស់អតិថិជន</h2>
      <table class="admin-table">
        <thead>
          <tr><th>លេខ Order</th><th>អតិថិជន</th><th>ទំនិញ</th><th>សរុប</th><th>ថ្ងៃខែ</th><th>ស្ថានភាព</th></tr>
        </thead>
        <tbody id="orderTableBody"></tbody>
      </table>
    </div>

  </div>

  <script src="js/admin.js"></script>
</body>
</html>
